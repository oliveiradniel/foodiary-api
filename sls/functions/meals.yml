createMeal:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/createMeal.handler
  events:
    - httpApi:
        path: /meals
        method: POST
        authorizer:
          name: CognitoAuthorizer

listMealsByDay:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/listMealsByDay.handler
  events:
    - httpApi:
        path: /meals
        method: GET
        authorizer:
          name: CognitoAuthorizer

getMealById:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/getMealById.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: GET
        authorizer:
          name: CognitoAuthorizer

onMealFileUploaded:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/onMealFileUploaded.handler
  events:
    - s3:
        bucket: !Ref MealsBucket
        event: s3:ObjectCreated:*
        existing: true
        forceDeploy: true

processMeal:
  environment: ${file(./sls/config/env.yml)}
  memorySize: 1024
  timeout: 120
  handler: src/main/functions/meals/processMeal.handler
  events:
    - sqs:
        arn: !GetAtt MealsQueue.Arn
        batchSize: 2
