createMeal:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/createMeal.handler
  events:
    - httpApi:
        path: /meals
        method: POST
        authorizer:
          name: CognitoAuthorizer

listMealsByDay:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/listMealsByDay.handler
  events:
    - httpApi:
        path: /meals
        method: GET
        authorizer:
          name: CognitoAuthorizer

getMealById:
  environment: ${file(./sls/config/env.yml)}
  handler: src/main/functions/meals/getMealById.handler
  events:
    - httpApi:
        path: /meals/{mealId}
        method: GET
        authorizer:
          name: CognitoAuthorizer
